# ロボット設定ファイル

width: 40
height: 40
scale: 1.20  # 走行距離を1/2にするため (旧1.5)
color: "gray"
sensorColor: "red"
wheelColor: "#399A9C"  # 車輪の色
axleColor: "black"  # 車軸の色


# シナリオの既定値。config/scenario/ からの相対パス
scenario:
  url: "2026/99_Lコース/scenario.json"

# 初期位置設定
# 名前付きで複数定義できる。2つ以上あると画面に「開始位置」の選択が出る。
# 先頭が既定値。1つしか無いコースでは選択は出ない。
initial_position:
  スタート:
    L:
      x: 515 # 初期X座標（Lコース）
      y: 30  # 初期Y座標（Lコース）
      angle: 90  # 初期角度（Lコース）
    R:
      x: 40 # 初期X座標（Rコース）
      y: 30  # 初期Y座標（Rコース）
      angle: 90  # 初期角度（Rコース）
  難所:
    L:
      x: 455 # 初期X座標（Lコース）黒ライン上・赤矢印位置
      y: 470 # 初期Y座標（Lコース）赤ボックスの左・上から約1/3
      angle: 180 # 初期角度（Lコース）左向き（←）
    R:
      x: 100 # 初期X座標（Rコース）
      y: 470  # 初期Y座標（Rコース）
      angle: 0  # 初期角度（Rコース）
  # ボトルデリバリーだけを試すための位置。キャリーボトル（65.3, 579.7）の
  # 手前に、ボトルを正面に見る向きで置く。ここから走らせると、拾う→色を読む→
  # 色で分かれる→運ぶ、までを毎回スタートから走らせずに確かめられる。
  ボトル置き場:
    L:
      x: 65   # キャリーボトルの真下
      y: 625  # ボトルから約45px（225mm）手前
      angle: 270 # 上向き（↑）。ボトルを正面に見る
    R:
      x: 491  # Lコースの反転（mirrorX 556 - 65）
      y: 625
      angle: 270
    
  力士ボトル確認位置:
    L:
      x: 65   # キャリーボトルの真下
      y: 300  # ボトルから約45px（225mm）手前
      angle: 70 # 上向き（↑）。ボトルを正面に見る
    R:
      x: 491  # Lコースの反転（mirrorX 556 - 65）
      y: 300
      angle: 120

  # ET相撲だけを試すための位置。99_Lコース で 3色の合流点から直進1300mm（ETラリーの経路が
  # 届かなかったときの 29/1 ＋ 30/3）を走り終えたところ。画面なし走行
  # （tools/headless-run）で拾った (209,468)・向き -178.9度 を使う。99_Lコース はこのあと
  # 土俵へ向き直ってから（30/4）力士寄せ（40/1）に入るが、ここでは向き直らずに始める。
  # 力士ボトル（土俵中央 134.5, 399.5）は約505mm 先、正面から右へ約42度ずれていて
  # カメラの画角（左右29度）の外。首振りで見つけるところから確かめられる。
  ET相撲_到達位置:
    L:
      x: 209
      y: 468
      angle: 181 # 左向き（←）。99_Lコース の到達時と同じ
    R:
      x: 347  # Lコースの反転（mirrorX 556 - 209）
      y: 468
      angle: 359 # 左右反転（180 - 181）
  # 同じ場所から、土俵の中心を正面に見る向き。力士ボトルは土俵の中のランダムな場所に
  # 置かれるが、この距離なら正面から左右18度以内に収まり、カメラの画角（左右29度）に入る。
  ET相撲_正面:
    L:
      x: 209
      y: 468
      angle: 223 # 土俵の中心の方向（atan2(399.5-468, 134.5-209)）
    R:
      x: 347
      y: 468
      angle: 317 # 左右反転（180 - 223）

wheel:
  # radius: 50  # 車輪半径[mm]
  # interval: 120  # 車輪間隔[mm]
  radius: 27.5  # 車輪半径[mm]
  interval: 125  # 車輪間隔[mm]

# 速度制御設定
speed:
  sample_num: 10  # サンプル数
  max_speed: 20.0 # 最大速度

# 方向制御設定
direction:
  drive_direction_cnt: 5  # 方向数

# タスク設定
task:
  period: 10  # タスク周期[ms]

# センサー設定
sensors:
  color:
    black_threshold: 0  # 黒の閾値
    white_threshold: 65  # 白の閾値
  sonar:
    enabled: true  # ソナー有効/無効
    max_distance: 200  # 最大検知距離[mm]
