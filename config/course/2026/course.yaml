# コース設定ファイル
# 2026年度用の設定

# コース画像設定
image:
  filename: "2026_competition_course_50pct_v0.3.pdf"  # 画像ファイル名
  width: 556  # 画像幅
  height: 750  # 画像高さ
  toriming: 250 # トリミング幅
  scale: 1.0  # スケール倍率
  # 縮尺[px/mm]。ETラリーの格子（ゲートポジションの丸い点）の間隔を、実際のコースの 246mm に合わせた。
  # 画像上の点の間隔は 横 50.91px・縦 51.54px（5x5 の点の中心を測った）。その平均 51.22px を 246mm とした。
  # 既定の 0.2（黒線 4px＝20mm から決めた値）だと格子が 255〜258mm になり、246mm で作ったシナリオの経路が
  # 入口から離れるほど格子からずれていた（奥の格子点で 30〜50mm）。
  # 画像は縦が横より 1.2% 引き伸ばされているので、1つの縮尺では 格子の端で ±6mm ほど残る。
  px_per_mm: 0.2082

# 座標設定
coordinates:
  origin:
    x: 0  # 原点X座標
    y: 0  # 原点Y座標
  start_line:
    x: 100  # スタートラインX座標
    y: 100  # スタートラインY座標
  goal_line:
    x: 400  # ゴールラインX座標
    y: 600  # ゴールラインY座標
  lap_gate:  # LAPゲートライン（2点を結ぶ線分）。実走行ログ計測: ロボットはx≈64-67を縦に通過する（LAPタグはx13-32, y496-560）。走行レーンを確実に横切るよう線分を設定。
    x1: 40
    y1: 528
    x2: 95
    y2: 528

# アウトゾーン設定（矩形指定）。走行体がこの範囲に触れるとコースアウトと判定する。
# 座標系は coordinates と同じ（image.width/height を基準としたワールド座標、L/R共通）。
# 例:
# out_zones:
#   - x: 100
#     y: 100
#     width: 50
#     height: 30
out_zones: []

# 色設定
colors:
  black:
    r: 0  # 赤成分
    g: 0  # 緑成分
    b: 0  # 青成分
    brightness: 0  # 明度
  white:
    r: 255  # 赤成分
    g: 255  # 緑成分
    b: 255  # 青成分
    brightness: 70  # 明度

# コースレイアウト設定
layout:
  checkpoints:  # チェックポイント
    - x: 200
      y: 200
    - x: 300
      y: 400
    - x: 400
      y: 500
